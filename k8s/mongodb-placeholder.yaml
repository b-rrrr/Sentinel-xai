apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-placeholders
  namespace: data-layer
  labels:
    branch: branch1-target-website
data:
  MONGODB_URI: "mongodb://admin:password@localhost:27017/sentinel_lab?authSource=admin"
  MONGODB_DB: "sentinel_lab"
  MONGODB_COLLECTION: "security_events"

---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-credentials
  namespace: data-layer
  labels:
    branch: branch1-target-website
type: Opaque
stringData:
  username: admin
  password: placeholder_password
  connection_string: "mongodb://admin:placeholder_password@mongodb-service:27017"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-placeholder
  namespace: data-layer
  labels:
    branch: branch1-target-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-placeholder
  template:
    metadata:
      labels:
        app: mongodb-placeholder
      annotations:
        container.apparmor.security.beta.kubernetes.io/prefix: runtime/default
    spec:
      containers:
      - name: placeholder-init
        image: alpine:latest
        command: ["sh", "-c", "echo 'MongoDB placeholder - replace with actual MongoDB deployment when URI provided' && sleep 3600"]
        resources:
          limits:
            memory: "64Mi"
            cpu: "100m"